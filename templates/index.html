<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bird Image Classifier</title>
    <style>
        body {
            font-family: 'Arial', sans-serif;
            margin: 0;
            padding: 0;
            background: linear-gradient(to bottom, #e8f5e9, #c8e6c9); /* Subtle green gradient */
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
        }

        .result-container {
            background-color: white;
            padding: 40px;
            border-radius: 12px;
            box-shadow: 0px 4px 12px rgba(0, 0, 0, 0.2);
            text-align: center;
            width: 90%;
            max-width: 500px;
            margin: 0 auto;  /* Centers the result container */
        }

        .result-container img {
            max-width: 80%;
            height: auto;
            margin: 0 auto;
            display: block;
        }

        .container {
            display: flex;
            flex-direction: row;
            justify-content: space-between;
            width: 90%;
            max-width: 1200px;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0px 4px 12px rgba(0, 0, 0, 0.2);
            background-color: white;
        }

        .left-section,
        .right-section {
            padding: 20px;
            flex: 1;
        }

        .left-section {
            background: url('https://www.transparenttextures.com/patterns/swirl.png'), linear-gradient(to bottom, #81c784, #a5d6a7);
            text-align: center;
            color: #2e7d32;
            display: flex;
            flex-direction: column;
            justify-content: center;
        }

        .left-section h1 {
            font-size: 2em;
            margin-bottom: 20px;
        }

        .left-section form {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        input[type="file"] {
            padding: 10px;
            font-size: 1em;
            border: 2px solid #66bb6a;
            border-radius: 8px;
            transition: border-color 0.3s;
        }

        input[type="file"]:focus {
            border-color: #388e3c;
            outline: none;
        }

        button {
            background-color: #388e3c;
            color: white;
            border: none;
            padding: 12px;
            font-size: 1.1em;
            border-radius: 8px;
            cursor: pointer;
            transition: transform 0.2s, background-color 0.3s;
        }

        button:hover {
            background-color: #2e7d32;
            transform: translateY(-3px);
        }

        .right-section {
            background-color: #e8f5e9;
            text-align: center;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .right-section img {
            max-width: 80%;
            height: auto;
            margin: 0 auto;
            display: block;
            border-radius: 12px;
        }
        
        .right-section .prediction {
            font-size: 1.5em;
            color: #2e7d32;
            margin-bottom: 10px;
        }

        .right-section .scientific-name {
            font-size: 1.2em;
            font-style: italic;
            color: #4caf50;
            margin-bottom: 10px;
        }

        .right-section .description {
            font-size: 1em;
            color: #555;
        }

        .footer {
            text-align: center;
            padding: 10px;
            margin-top: 20px;
            background-color: transparent;
            font-size: 1em;
            color: #388e3c;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="left-section">
            <h1>Upload Bird Image</h1>
            <form id="uploadForm" enctype="multipart/form-data">
                <input type="file" id="file" name="file" accept="image/*" required>
                <button type="submit">Submit</button>
            </form>
        </div>
        <div class="right-section">
            <div id="output">
                <img id="uploadedImage" alt="Uploaded Bird Image" style="display: none;">
                <div id="prediction" class="prediction"></div>
                <div id="scientificName" class="scientific-name"></div>
                <div id="description" class="description"></div>
                <img id="birdImage" alt="Bird Image" style="display: none; margin-top: 10px; border-radius: 12px;">
            </div>
        </div>
    </div>
    <footer class="footer">
        Powered by MobileNetV3 - Bird Classifier
    </footer>
    <script>
        document.getElementById('uploadForm').onsubmit = function(event) {
            event.preventDefault();
            const fileInput = document.getElementById('file');
            const file = fileInput.files[0];

            if (!file) {
                alert("Please select a file.");
                return;
            }

            // Display uploaded image
            const reader = new FileReader();
            reader.onload = function(e) {
                document.getElementById("uploadedImage").src = e.target.result;
                document.getElementById("uploadedImage").style.display = "block";
            };
            reader.readAsDataURL(file);

            // Prepare form data and send request to backend
            const formData = new FormData();
            formData.append("file", file);

            fetch("/predict", {
                method: "POST",
                body: formData
            })
                .then(response => response.json())
                .then(data => {
                    if (data.error) {
                        alert(data.error);
                    } else {
                        document.getElementById("prediction").textContent = `Prediction: ${data.prediction}`;
                        document.getElementById("scientificName").textContent = `Scientific Name: ${data.scientific_name}`;
                        document.getElementById("description").textContent = `Description: ${data.description}`;
                        document.getElementById("birdImage").src = `/static/images/${data.image}`;
                        document.getElementById("birdImage").style.display = "block";
                    }
                })
                .catch(error => {
                    console.error("Error:", error);
                    alert("Something went wrong. Please try again.");
                });
        };
    </script>
</body>
</html>
