<!DOCTYPE html>

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bird Classification Result</title>
    <style>
        body {
            font-family: 'Arial', sans-serif;
            background-color: #f1f8e9;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }

        .result-container {
            background-color: white;
            padding: 40px;
            border-radius: 12px;
            box-shadow: 0px 4px 12px rgba(0, 0, 0, 0.2);
            text-align: center;
            width: 90%;
            max-width: 500px;
        }

        img {
            max-width: 100%;
            border-radius: 12px;
            margin-bottom: 20px;
        }

        h1 {
            font-size: 2em;
            color: #2e7d32;
            margin-bottom: 20px;
        }

        p {
            font-size: 1.2em;
            color: #555;
        }

        .scientific-name {
            font-style: italic;
            color: #777;
        }
    </style>
</head>

<body>

    <div class="result-container">
        <h1>Classification Result</h1>
        <img id="uploadedImage" alt="Uploaded Bird Image" />
        <p id="predictionText"></p>
        <p class="scientific-name" id="scientificNameText"></p>
        <p id="descriptionText"></p>
    </div>

    <script>
        // Function to get URL parameters
        function getQueryParam(param) {
            var urlParams = new URLSearchParams(window.location.search);
            return urlParams.get(param);
        }

        // Get the prediction and image from the URL
        var prediction = getQueryParam('prediction');
        var imageUrl = getQueryParam('image');

        // Log them for debugging purposes
        console.log("Prediction:", prediction);
        console.log("Image URL:", imageUrl);

            'White-Wagtail': {

                'image': 'white_wagtail.jpg'

        };


        // Display the prediction, image, and additional info
        if (prediction && imageUrl) {
            document.getElementById('predictionText').textContent = "This is a " + prediction + " bird.";
            document.getElementById('uploadedImage').src = imageUrl;

            // Get bird information based on prediction
            if (bird_info[prediction]) {
                document.getElementById('scientificNameText').textContent = "Scientific Name: " + bird_info[prediction].scientific_name;
                document.getElementById('descriptionText').textContent = bird_info[prediction].description;
            } else {
                document.getElementById('scientificNameText').textContent = "";
                document.getElementById('descriptionText').textContent = "No detailed information available.";
            }
        } else {
            document.getElementById('predictionText').textContent = "No prediction data available.";
        }
    </script>

</body>

</html>
